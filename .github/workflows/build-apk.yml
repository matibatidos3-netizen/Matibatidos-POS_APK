name: Compilar APK Matibatidos RC6

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - principal

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Comprobar archivos del proyecto
        shell: bash
        run: |
          set -e
          echo "Contenido de la raíz del repositorio:"
          ls -la

          for f in settings.gradle build.gradle gradle.properties app/build.gradle app/src/main/AndroidManifest.xml app/src/main/assets/index.html app/src/main/java/com/matibatidos/pos/MainActivity.java; do
            if [ ! -f "$f" ]; then
              echo "ERROR: falta $f"
              exit 1
            fi
          done

          echo "Estructura Android correcta."

      - name: Preparar Android SDK
        shell: bash
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: no se encontró sdkmanager."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Descargar SheetJS para Excel
        run: |
          curl --fail --location --retry 3 \
            https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js \
            --output app/src/main/assets/xlsx.full.min.js

          test -s app/src/main/assets/xlsx.full.min.js

      - name: Descargar Chart.js para gráficos
        run: |
          curl --fail --location --retry 3 \
            https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js \
            --output app/src/main/assets/chart.umd.min.js

          test -s app/src/main/assets/chart.umd.min.js

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle --no-daemon clean assembleDebug

      - name: Verificar APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Matibatidos-POS-APK-RC6
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
