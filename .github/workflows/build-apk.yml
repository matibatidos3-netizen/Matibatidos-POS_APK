name: Compilar APK Matibatidos RC6

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - principal

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extraer proyecto Android
        id: extract
        shell: bash
        run: |
          set -e

          ZIP="Matibatidos_RC6_APK_LISTO_PARA_GITHUB.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: No se encuentra $ZIP en la raíz."
            ls -la
            exit 1
          fi

          mkdir -p android_project
          unzip -q "$ZIP" -d android_project

          echo "Contenido extraído:"
          find android_project -maxdepth 3 -type f | head -80

          SETTINGS=$(find android_project \
            -type f -name settings.gradle \
            -not -path '*/.git/*' \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: El ZIP no contiene settings.gradle."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Proyecto localizado en: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Verificar archivos Android
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: |
          set -e
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html

          echo "Estructura Android verificada."

      - name: Preparar Android SDK
        shell: bash
        run: |
          set -e

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -print -quit)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: No se encontró sdkmanager."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Descargar SheetJS para Excel
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: |
          mkdir -p app/src/main/assets

          curl --fail --location --retry 3 \
            https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js \
            --output app/src/main/assets/xlsx.full.min.js

          test -s app/src/main/assets/xlsx.full.min.js

      - name: Descargar Chart.js
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: |
          curl --fail --location --retry 3 \
            https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js \
            --output app/src/main/assets/chart.umd.min.js

          test -s app/src/main/assets/chart.umd.min.js

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: |
          gradle --no-daemon clean assembleDebug

      - name: Verificar APK
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Matibatidos-POS-APK-RC6
          path: ${{ steps.extract.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
